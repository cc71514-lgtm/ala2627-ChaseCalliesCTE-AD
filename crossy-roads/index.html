<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Crossy Road</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Arcade</p>
        <h1>Neon Crossy Road</h1>
      </div>
      <div class="scoreboard">
        <div class="stat">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span>Best</span>
          <strong id="best">0</strong>
        </div>
      </div>
    </header>

    <div class="status-row">
      <p id="message">Press Start to begin.</p>
      <button id="start-btn" type="button">Start Game</button>
    </div>

    <div id="board" class="board" aria-label="Crossy road game board"></div>
  </main>

  <script src="script.js"></script>
</body>

</html>
